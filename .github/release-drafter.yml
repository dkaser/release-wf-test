categories:
  - title: "🚀 Features"
    when:
      labels:
        - "feat"
  - title: "🐛 Bug Fixes"
    when:
      labels:
        - "fix"
  - title: "🧰 Maintenance"
    when:
      labels:
        - "chore"
        - "refactor"
  - type: "pre-exclude"
    when:
      labels:
        - "docs"
        - "test"
        - "ci"
        - "perf"
        - "refactor"
change-template: "- $TITLE ([#$NUMBER]($URL))"
category-template: "### $TITLE"
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
template: |
  $CHANGES
prerelease: "true"
include-pre-releases: "true"
latest: "false"
replacers:
  - search: "/^- (feat|fix|chore|refactor)(\\(.+\\))?: /m"
    replace: "- "
